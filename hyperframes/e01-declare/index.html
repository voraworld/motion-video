<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      E01 customs, first half (placed at 17.9 s for 4.4 s): "The export declaration is filed before the container
      enters the port." The declaration sheet lands on the customs card and is stamped FILED on "filed" (19.76 s);
      then the order is shown as two steps: 1 declaration filed → 2 container enters the port (PMK 155/2022: the PEB
      is due before the goods enter the customs area at the port of loading). Field lines are blank placeholders.
      Transparent WebM → remotion/public/hf/e01-declare.webm.
    -->
    <style>
      :root { --ink: #2b1c15; --orange: #f26a1f; --deep: #c8471a; --amber: #f5a623; --font-display: "Archivo Black", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      #doc { position: absolute; left: 330px; top: 540px; width: 420px; height: 505px; border-radius: 18px; background: #fff; box-shadow: 0 30px 60px rgba(43,28,21,.28), 0 4px 12px rgba(43,28,21,.12); overflow: hidden; }
      #doc-head { position: absolute; left: 0; top: 0; width: 420px; height: 142px; background: linear-gradient(120deg, var(--deep), var(--orange) 75%, #f2822c); color: #fff; padding: 22px 28px; }
      #doc-head .t1 { font-size: 30px; line-height: 1.05; }
      #doc-head .t2 { font-size: 24px; margin-top: 6px; text-shadow: 0 1px 6px rgba(120,30,0,.55); }
      #doc-ico { position: absolute; right: 22px; top: 26px; width: 60px; height: 60px; color: rgba(255,255,255,.9); }
      .ln { position: absolute; left: 32px; height: 16px; border-radius: 8px; background: #ece4dc; transform-origin: 0% 50%; }
      #stamp { position: absolute; left: 140px; top: 330px; width: 250px; height: 110px; border: 7px solid var(--deep); border-radius: 16px; color: var(--deep); display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 46px; letter-spacing: .04em; background: rgba(255,255,255,.88); }
      #stamp svg { width: 50px; height: 50px; }
      #steps { position: absolute; left: 200px; top: 1080px; width: 680px; height: 160px; border-radius: 0 0 40px 40px; background: #fff; display: flex; align-items: center; justify-content: center; gap: 18px; }
      .step { display: flex; align-items: center; gap: 14px; font-size: 25px; line-height: 1.1; color: var(--ink); }
      .badge { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
      .badge svg { width: 36px; height: 36px; }
      #s1 .badge { background: var(--orange); color: #fff; }
      #s2 .badge { background: var(--ink); color: #fff; }
      .num { color: var(--deep); font-size: 20px; letter-spacing: .1em; }
      #arr { width: 54px; height: 6px; border-radius: 3px; background: var(--orange); transform-origin: 0% 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="e01-declare" data-start="0" data-duration="4.4" data-width="1080" data-height="1920">
      <div id="doc" class="clip" data-start="0" data-duration="4.4" data-track-index="0">
        <div id="doc-head"><div class="t1">EXPORT<br />DECLARATION</div><div class="t2">(PEB)</div><svg id="doc-ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34ZM160,176H96a8,8,0,0,1,0-16h64a8,8,0,0,1,0,16Zm0-32H96a8,8,0,0,1,0-16h64a8,8,0,0,1,0,16Zm-8-56V44l44,44Z"/></svg></div>
        <div class="ln" style="top:172px;width:300px"></div>

        <div class="ln" style="top:248px;width:240px"></div>
        <div class="ln" style="top:286px;width:330px"></div>
        <div class="ln" style="top:462px;width:200px"></div>
        <div id="stamp"><svg class="" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M225.86,102.82c-3.77-3.94-7.67-8-9.14-11.57-1.36-3.27-1.44-8.69-1.52-13.94-.15-9.76-.31-20.82-8-28.51s-18.75-7.85-28.51-8c-5.25-.08-10.67-.16-13.94-1.52-3.56-1.47-7.63-5.37-11.57-9.14C146.28,23.51,138.44,16,128,16s-18.27,7.51-25.18,14.14c-3.94,3.77-8,7.67-11.57,9.14C88,40.64,82.56,40.72,77.31,40.8c-9.76.15-20.82.31-28.51,8S41,67.55,40.8,77.31c-.08,5.25-.16,10.67-1.52,13.94-1.47,3.56-5.37,7.63-9.14,11.57C23.51,109.72,16,117.56,16,128s7.51,18.27,14.14,25.18c3.77,3.94,7.67,8,9.14,11.57,1.36,3.27,1.44,8.69,1.52,13.94.15,9.76.31,20.82,8,28.51s18.75,7.85,28.51,8c5.25.08,10.67.16,13.94,1.52,3.56,1.47,7.63,5.37,11.57,9.14C109.72,232.49,117.56,240,128,240s18.27-7.51,25.18-14.14c3.94-3.77,8-7.67,11.57-9.14,3.27-1.36,8.69-1.44,13.94-1.52,9.76-.15,20.82-.31,28.51-8s7.85-18.75,8-28.51c.08-5.25.16-10.67,1.52-13.94,1.47-3.56,5.37-7.63,9.14-11.57C232.49,146.28,240,138.44,240,128S232.49,109.73,225.86,102.82Zm-52.2,6.84-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32Z"/></svg><span>FILED</span></div>
      </div>
      <div id="steps" class="clip" data-start="0" data-duration="4.4" data-track-index="1">
        <div class="step" id="s1"><div class="badge"><svg class="" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34ZM160,176H96a8,8,0,0,1,0-16h64a8,8,0,0,1,0,16Zm0-32H96a8,8,0,0,1,0-16h64a8,8,0,0,1,0,16Zm-8-56V44l44,44Z"/></svg></div><div><div class="num">STEP 1</div>DECLARATION<br />FILED</div></div>
        <div id="arr"></div>
        <div class="step" id="s2"><div class="badge"><svg class="" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M255.43,117l-14-35A15.93,15.93,0,0,0,226.58,72H192V64a8,8,0,0,0-8-8H32A16,16,0,0,0,16,72V184a16,16,0,0,0,16,16H49a32,32,0,0,0,62,0h50a32,32,0,0,0,62,0h17a16,16,0,0,0,16-16V120A8.13,8.13,0,0,0,255.43,117ZM80,208a16,16,0,1,1,16-16A16,16,0,0,1,80,208ZM32,136V72H176v64Zm160,72a16,16,0,1,1,16-16A16,16,0,0,1,192,208Zm0-96V88h34.58l9.6,24Z"/></svg></div><div><div class="num">STEP 2</div>CONTAINER<br />ENTERS PORT</div></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // VO (relative to 17.9 s): "export declaration" 0.53, "filed" 1.86, "before" 2.39, "container enters the port" 2.75–3.7.
      tl.fromTo("#doc", { y: 260, rotation: -8, opacity: 0, scale: 0.9 }, { y: 0, rotation: -3, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0.45);
      tl.fromTo(".ln", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out", stagger: 0.12 }, 0.9);
      tl.fromTo("#stamp", { scale: 2.4, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: -10, duration: 0.18, ease: "power4.in" }, 1.72);
      tl.fromTo("#doc", { x: 0 }, { x: -8, duration: 0.05, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, 1.9);
      tl.fromTo("#steps", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.1);
      tl.fromTo("#s1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 2.2);
      tl.fromTo("#arr", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, 2.45);
      tl.fromTo("#s2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 2.75);
      tl.to("#doc", { y: -60, scale: 0.86, opacity: 0, duration: 0.5, ease: "power2.in" }, 3.75);
      tl.to("#steps", { opacity: 0, y: 20, duration: 0.3, ease: "power2.in" }, 4.05);
      window.__timelines["e01-declare"] = tl;
    </script>
