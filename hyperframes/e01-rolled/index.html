<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      E01 "stuck" insert (33–38 s): "ROLLED." slams in with an RGB-split glitch while the ship leaves without the container.
      Transparent WebM → remotion/public/hf/e01-rolled.webm.
    -->
    <style>
      :root { --ink: #2b1c15; --red: #ff3b30; --cyan: #1fc8ff; --font-display: "Archivo Black", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      .stack { position: absolute; left: 90px; width: 870px; top: 360px; height: 200px; text-align: center; font-size: 190px; line-height: 1; }
      .copy { position: absolute; inset: 0; }
      #rolled-red { color: var(--red); mix-blend-mode: multiply; }
      #rolled-cyan { color: var(--cyan); mix-blend-mode: multiply; }
      #rolled-main { color: #d63a1f; }
      #rolled-strike { position: absolute; left: 150px; width: 750px; top: 455px; height: 22px; border-radius: 12px; background: #2b1c15; transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="e01-rolled" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="rolled-text" class="stack clip" data-start="0" data-duration="5" data-track-index="0" data-layout-allow-overlap>
        <div class="copy" id="rolled-red">ROLLED.</div>
        <div class="copy" id="rolled-cyan">ROLLED.</div>
        <div class="copy" id="rolled-main">ROLLED.</div>
      </div>
      <div id="rolled-strike-wrap" class="clip" data-start="0" data-duration="5" data-track-index="1" data-layout-ignore>
        <div id="rolled-strike"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#rolled-text", { scale: 2.2, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, 0.03);
      const jumps = [[-16, 4], [12, -4], [-8, 0], [20, 6], [-22, -5], [8, 2], [-12, 3], [16, -6], [-5, 1], [0, 0]];
      jumps.forEach(([x, y], i) => {
        const t = 0.05 + i * 0.067;
        tl.set("#rolled-red", { x, y }, t);
        tl.set("#rolled-cyan", { x: -x * 0.8, y: -y }, t);
      });
      tl.set(["#rolled-red", "#rolled-cyan"], { x: 3, y: 0 }, 0.8);
      // The strike-through draws across: the cut-off was missed.
      tl.fromTo("#rolled-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 1.2);
      tl.fromTo(["#rolled-text", "#rolled-strike"], { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in" }, 4.75);
      window.__timelines["e01-rolled"] = tl;
    </script>
  </body>
</html>
