<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      E01 hook insert (0–4 s), transparent WebM → remotion/public/hf/e01-hook.webm.
      A split-flap board slams in on frame 1 inside the UGC ring (e01-medallion), spins and lands on 07 at 0.45 s.
      "7 HANDOFFS." lands with it; "DROP ONE?" slams at 2.2 s as one ring segment snaps off and falls.
    -->
    <style>
      :root { --ink: #ffffff; --accent: #f26a1f; --flap: #1c1c1e; --flap-hi: #2c2c2f; --font-display: "Archivo Black", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      .line { position: absolute; left: 90px; width: 870px; text-align: center; line-height: 1; white-space: nowrap; color: var(--ink); text-shadow: 0 8px 30px rgba(0,0,0,.5); }
      #hook-l1 { top: 250px; font-size: 104px; }
      #hook-l2 { top: 372px; font-size: 104px; color: var(--accent); }
      .w { display: inline-block; }
      #hook-board { position: absolute; left: 0; right: 0; top: 795px; display: flex; justify-content: center; gap: 26px; }
      .card { position: relative; width: 236px; height: 330px; border-radius: 26px; background: linear-gradient(180deg, var(--flap-hi) 0 50%, var(--flap) 50% 100%); box-shadow: 0 30px 60px rgba(0,0,0,.55), inset 0 0 0 3px rgba(255,255,255,.06); overflow: hidden; }
      .card .d { position: absolute; inset: 0; display: grid; place-items: center; font-size: 270px; color: #fff4e8; line-height: 1; }
      .card .seam { position: absolute; left: 0; right: 0; top: 163px; height: 4px; background: rgba(0,0,0,.65); }
      .card .flap { position: absolute; left: 0; right: 0; top: 0; height: 165px; background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0)); transform-origin: 50% 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="e01-hook" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="hook-l1" class="line clip" data-start="0" data-duration="4" data-track-index="0" data-layout-allow-overlap>
        <span class="w" id="hook-w1">7</span> <span class="w" id="hook-w2">HANDOFFS.</span>
      </div>
      <div id="hook-l2" class="line clip" data-start="2.2" data-duration="1.8" data-track-index="1" data-layout-allow-overlap>
        <span class="w" id="hook-w3">DROP</span> <span class="w" id="hook-w4">ONE?</span>
      </div>
      <div id="hook-board" class="clip" data-start="0" data-duration="4" data-track-index="2" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="card" id="hook-c1"><div class="d" id="hook-d1">0</div><div class="flap" id="hook-f1" data-layout-allow-occlusion></div><div class="seam" data-layout-allow-occlusion></div></div>
        <div class="card" id="hook-c2"><div class="d" id="hook-d2">0</div><div class="flap" id="hook-f2" data-layout-allow-occlusion></div><div class="seam" data-layout-allow-occlusion></div></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Board slams in from huge and blurred on frame 1.
      tl.fromTo("#hook-board .card", { scale: 2.6, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "expo.out", stagger: 0.03 }, 0.033);
      // Split-flap spin: the right card cycles digits every 2 frames and lands on 7; the left card stays 0.
      const seq = ["4", "9", "2", "6", "1", "8", "3", "5", "0", "7"];
      seq.forEach((d, i) => {
        const t = 0.05 + i * 0.04;
        tl.set("#hook-d2", { textContent: d }, t);
        tl.fromTo("#hook-f2", { rotationX: 0, opacity: 0.9 }, { rotationX: -90, opacity: 0, duration: 0.035, ease: "none" }, t);
      });
      tl.fromTo("#hook-f1", { rotationX: 0, opacity: 0.9 }, { rotationX: -90, opacity: 0, duration: 0.05, ease: "none" }, 0.1);
      // Landing punch on 07.
      tl.fromTo("#hook-c2", { y: -18 }, { y: 0, duration: 0.18, ease: "back.out(3)" }, 0.45);
      // "7 HANDOFFS." lands with the 07.
      const slam = (sel, at) => tl.fromTo(sel, { scale: 2.3, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, at);
      slam("#hook-w1", 0.45);
      slam("#hook-w2", 0.52);
      // "DROP ONE?" when the baton freezes.
      slam("#hook-w3", 2.2);
      slam("#hook-w4", 2.3);
      // Board steps back so the world can open behind it.
      tl.fromTo("#hook-board", { scale: 1, opacity: 1 }, { scale: 0.86, opacity: 0, duration: 0.3, ease: "power3.in" }, 3.55);
      tl.fromTo(["#hook-l1 .w", "#hook-l2 .w"], { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in", stagger: 0.02 }, 3.7);
      window.__timelines["e01-hook"] = tl;
    </script>
  </body>
</html>
