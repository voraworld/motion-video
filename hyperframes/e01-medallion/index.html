      swaps at every handoff with the registry's morph-swap "condense" move (outgoing shrink-fades, incoming lands with
      back.out), so the ready-made icons (Phosphor Icons 2.1.1, fill, MIT) are always shown intact. Ring after conic-progress-ring.
      Remotion places and scales this clip: big around the 07 board in the hook, under the carousel for the
      stations, centred for the UGC orbit, and into the logo's G for the end card.
      Times come from the E01 VO (scripts/vo.mjs): stuffed 10.0, trucked 12.25, customs 17.0, loaded 26.0,

    <script>
      window.__timelines = window.__timelines || {};
      const NS = "http://www.w3.org/2000/svg";
      const C = 450, R = 400, W = 52, N = 7, GAP = 9;
      const arc = (a0, a1) => {
        const p = (a) => [C + R * Math.cos(((a - 90) * Math.PI) / 180), C + R * Math.sin(((a - 90) * Math.PI) / 180)];
        const [x0, y0] = p(a0), [x1, y1] = p(a1);
        return `M ${x0} ${y0} A ${R} ${R} 0 0 1 ${x1} ${y1}`;
      };
      const segLen = (2 * Math.PI * R * (360 / N - GAP)) / 360;
      const segs = [], glows = [];
      for (let i = 0; i < N; i++) {
        const a0 = i * (360 / N) + GAP / 2, a1 = (i + 1) * (360 / N) - GAP / 2;
        const mk = (parent, stroke) => {
          const p = document.createElementNS(NS, "path");
          p.setAttribute("d", arc(a0, a1));
          p.setAttribute("fill", "none");
          p.setAttribute("stroke", stroke);
          p.setAttribute("stroke-width", W);
          p.setAttribute("stroke-linecap", "round");
          parent.appendChild(p);
          return p;
        };
        mk(document.getElementById("med-track"), "rgba(43,28,21,0.10)");
        const g = mk(document.getElementById("med-glow"), "url(#med-grad)");
        const s = mk(document.getElementById("med-segs"), "url(#med-grad)");
        s.id = `med-seg${i}`;
        for (const el of [s, g]) { el.style.strokeDasharray = segLen; el.style.strokeDashoffset = segLen; }
        segs.push(s); glows.push(g);
      }
      // morph-swap "condense": A shrink-fades to centre while B scales up through the same spot (0.15 s overlap).
      let current = null;
      const swap = (name, at) => {
        if (current) tl.to(`#med-i-${current}`, { scale: 0.72, opacity: 0, duration: 0.35, ease: "power2.in", svgOrigin: "128 128" }, at);
        tl.fromTo(`#med-i-${name}`, { scale: 0.72, opacity: 0, svgOrigin: "128 128" }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)", svgOrigin: "128 128", immediateRender: false }, at + (current ? 0.2 : 0));
        current = name;
      };
      const T = { booking: 4.0, stuffed: 10.0, trucked: 12.25, customs: 17.0, loaded: 26.0, bl: 27.51, arrived: 29.41, delivered: 30.54, stuck: 33.0, ugc: 38.0, cta: 48.0 };
      const tl = gsap.timeline({ paused: true });
      const draw = (i, at, dur = 0.45, ease = "power3.out") => {
        tl.fromTo(segs[i], { strokeDashoffset: segLen }, { strokeDashoffset: 0, duration: dur, ease }, at);
        tl.fromTo(glows[i], { strokeDashoffset: segLen }, { strokeDashoffset: 0, duration: dur, ease }, at);
      };
      const pulse = (at) => tl.fromTo("#med-disc", { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power3.out", yoyo: true, repeat: 1 }, at);

      // Hook: disc and icon hidden; the ring slams in around the 07 board.
      for (let i = 0; i < N; i++) draw(i, 0.05 + i * 0.05, 0.3, "power4.out");
      tl.fromTo("#med-svg", { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out", transformOrigin: "50% 50%" }, 0.03);
      // "DROP ONE?": the seventh segment snaps off and falls.
      tl.to(segs[6], { x: -40, y: 640, rotation: -60, svgOrigin: "275 90", opacity: 0, duration: 0.95, ease: "power2.in" }, 2.2);
      // Reset before the world opens: the ring empties, the disc arrives.
      tl.to(segs.slice(0, 6), { strokeDashoffset: segLen, duration: 0.3, ease: "power2.in", stagger: 0.02 }, 3.45);
      tl.set(glows, { strokeDashoffset: segLen }, 3.8);
      tl.set(segs[6], { x: 0, y: 0, rotation: 0, opacity: 1, strokeDashoffset: segLen }, 3.8);
      tl.fromTo("#med-disc", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 3.75);
      tl.fromTo("#med-icon", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)", transformOrigin: "50% 50%" }, 3.9);
      swap("clock", 3.95);

      // Handoffs: one segment per step, the icon morphs.
      draw(0, T.booking);
      draw(1, T.stuffed); swap("carton", T.stuffed); pulse(T.stuffed + 0.45);
      draw(2, T.trucked); swap("container", T.trucked); pulse(T.trucked + 0.45);
      draw(3, T.customs); swap("shield", T.customs); pulse(T.customs + 0.45);
      draw(4, T.loaded); swap("ship", T.loaded); pulse(T.loaded + 0.45);
      swap("doc", T.bl);
      draw(5, T.arrived); swap("pin", T.arrived); pulse(T.arrived + 0.45);
      draw(6, T.delivered); swap("house", T.delivered); pulse(T.delivered + 0.45);

      // Stuck: the cargo is a lonely container again and the "loaded" segment breaks away.
      swap("container", T.stuck);
      tl.to(segs[4], { x: -30, y: 520, rotation: -50, svgOrigin: "139 702", opacity: 0, duration: 0.95, ease: "power2.in" }, T.stuck + 0.8);
      tl.to(glows[4], { opacity: 0, duration: 0.2 }, T.stuck + 0.8);

      // UGC: the missing segment comes back, the ring glows, the icon becomes a check.
      tl.set(segs[4], { x: 0, y: 0, rotation: 0, opacity: 1, strokeDashoffset: segLen }, T.ugc);
      tl.set(glows[4], { opacity: 1 }, T.ugc);
      draw(4, T.ugc + 0.15, 0.5);
      swap("check", T.ugc + 0.2);
      tl.fromTo("#med-glow", { opacity: 0 }, { opacity: 0.85, duration: 0.6, ease: "power2.out" }, T.ugc + 0.5);
      tl.to("#med-glow", { opacity: 0.45, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 5 }, T.ugc + 1.2);
      // End card hand-off: icon and disc leave, the bare ring flies into the logo's G (Remotion moves it).
      tl.to("#med-icon", { opacity: 0, scale: 0.6, duration: 0.25, ease: "power2.in", transformOrigin: "50% 50%" }, T.cta - 0.3);
      tl.to("#med-disc", { opacity: 0, scale: 0.85, duration: 0.3, ease: "power2.in" }, T.cta - 0.2);
      tl.to("#med-glow", { opacity: 0, duration: 0.3 }, T.cta - 0.2);
      window.__timelines["e01-medallion"] = tl;
    </script>
