<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      E01 UGC card (38–48 s): "ONE TEAM. ALL 7 HANDOFFS." with a row of seven handoff marks that tick one by one.
      Transparent WebM → remotion/public/hf/e01-team.webm. Remotion draws the zoomed-out panorama behind it.
    -->
    <style>
      :root { --ink: #2b1c15; --accent: #f26a1f; --ok: #2e8b57; --font-display: "Archivo Black", sans-serif; --font-body: "Inter", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      .line { position: absolute; left: 90px; width: 870px; text-align: center; line-height: 1; font-size: 104px; color: var(--ink); }
      #team-l1 { top: 350px; }
      #team-l2 { top: 470px; color: var(--accent); }
      .w { display: inline-block; }
      #team-row { position: absolute; left: 90px; width: 870px; top: 1000px; display: flex; justify-content: space-between; }
      .mark { width: 96px; height: 96px; border-radius: 50%; background: #fff; border: 6px solid var(--accent); display: grid; place-items: center; font-family: var(--font-body); font-weight: 900; font-size: 40px; color: var(--accent); box-shadow: 0 10px 24px rgba(43,28,21,.18); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="e01-team" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="team-l1" class="line clip" data-start="0" data-duration="10" data-track-index="0">
        <span class="w" id="team-w1">ONE</span> <span class="w" id="team-w2">TEAM.</span>
      </div>
      <div id="team-l2" class="line clip" data-start="0.35" data-duration="9.65" data-track-index="1">
        <span class="w" id="team-w3">ALL</span> <span class="w" id="team-w4">7</span> <span class="w" id="team-w5">HANDOFFS.</span>
      </div>
      <div id="team-row" class="clip" data-start="0" data-duration="10" data-track-index="2">
        <div class="mark" id="team-m1">1</div><div class="mark" id="team-m2">2</div><div class="mark" id="team-m3">3</div><div class="mark" id="team-m4">4</div><div class="mark" id="team-m5">5</div><div class="mark" id="team-m6">6</div><div class="mark" id="team-m7">7</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const slam = (sel, at) => tl.fromTo(sel, { scale: 2.2, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, at);
      slam("#team-w1", 0.03); slam("#team-w2", 0.13);
      slam("#team-w3", 0.4); slam("#team-w4", 0.5); slam("#team-w5", 0.6);
      tl.fromTo(".mark", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.06 }, 0.9);
      // Each handoff ticks green, one after another, as the baton runs the line.
      for (let i = 1; i <= 7; i++) {
        const t = 2.0 + (i - 1) * 0.55;
        tl.set(`#team-m${i}`, { textContent: "✓", backgroundColor: "#2e8b57", borderColor: "#2e8b57", color: "#ffffff" }, t);
        tl.fromTo(`#team-m${i}`, { scale: 1.3 }, { scale: 1, duration: 0.2, ease: "power2.out" }, t);
      }
      tl.fromTo(["#team-l1 .w", "#team-l2 .w", "#team-row"], { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in", stagger: 0.02 }, 9.7);
      window.__timelines["e01-team"] = tl;
    </script>
  </body>
</html>
