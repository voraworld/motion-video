<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      E01 UGC card (38–48 s): "ONE TEAM. ALL 7 HANDOFFS." (the seven stations orbit the ring in Remotion).
      Transparent WebM → remotion/public/hf/e01-team.webm. Remotion draws the zoomed-out panorama behind it.
    -->
    <style>
      :root { --ink: #2b1c15; --accent: #f26a1f; --ok: #2e8b57; --font-display: "Archivo Black", sans-serif; --font-body: "Inter", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      .line { position: absolute; left: 80px; width: 920px; text-align: center; line-height: 1; font-size: 96px; color: var(--ink); white-space: nowrap; }
      #team-l1 { top: 236px; }
      #team-l2 { top: 350px; color: var(--accent); }
      .w { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="e01-team" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="team-l1" class="line clip" data-start="0" data-duration="10" data-track-index="0">
        <span class="w" id="team-w1">ONE</span> <span class="w" id="team-w2">TEAM.</span>
      </div>
      <div id="team-l2" class="line clip" data-start="0.35" data-duration="9.65" data-track-index="1">
        <span class="w" id="team-w3">ALL</span> <span class="w" id="team-w4">7</span> <span class="w" id="team-w5">HANDOFFS.</span>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const slam = (sel, at) => tl.fromTo(sel, { scale: 2.2, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, at);
      slam("#team-w1", 0.03); slam("#team-w2", 0.13);
      slam("#team-w3", 0.4); slam("#team-w4", 0.5); slam("#team-w5", 0.6);
      tl.fromTo(["#team-l1 .w", "#team-l2 .w"], { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in", stagger: 0.02 }, 9.7);
      window.__timelines["e01-team"] = tl;
    </script>
  </body>
</html>
