      .ok { flex: none; width: 54px; height: 54px; color: var(--b); }
      .ok svg { width: 100%; height: 100%; }
      .shine { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.16), transparent); pointer-events: none; }

    <script>

      };

      tl.fromTo("#chip-0 .ok", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.6)" }, 2.54);

      tl.fromTo("#chip-0 .shine", { xPercent: -120 }, { xPercent: 260, duration: 0.7, ease: "power2.inOut" }, 2.47);

      tl.fromTo("#chip-2 .ok", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.6)" }, 4.77);

      tl.fromTo("#chip-2 .shine", { xPercent: -120 }, { xPercent: 260, duration: 0.7, ease: "power2.inOut" }, 4.70);
      // Out: the tiles drop away (the container is about to fall through the gate).
      tl.to(".flap", { y: 260, rotationX: 70, opacity: 0, duration: 0.32, ease: "power3.in", stagger: 0.05 }, 8.6);
