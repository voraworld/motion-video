<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      E02 hook text (0–4 s), transparent WebM → remotion/public/hf/e02-hook.webm.
      Gravity type: every word drops from above and lands with a hard stop and a short springy bounce,
      the same motion the container makes at each gate. The container lands at 0.40 s in Remotion,
      so "SHIP DOCKED." lands right after the impact; "CARGO DIDN'T MOVE." follows the VO.
      At 3.55 s the words fall out of frame (the camera starts falling to gate 1).
    -->
    <style>
      @font-face { font-family: "League Gothic"; src: url("assets/LeagueGothic-var.woff2") format("woff2"); font-weight: 400; }
      :root { --white: #fff7ef; --orange: #f26a1f; --amber: #f5a623; --font-cond: "League Gothic", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-cond); }
      .line { position: absolute; left: 80px; width: 920px; line-height: 0.9; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.01em; }
      #hook-l1 { top: 218px; font-size: 212px; color: var(--white); text-shadow: 0 10px 40px rgba(0, 0, 0, 0.55); }
      #hook-l2 { top: 418px; font-size: 156px; color: var(--orange); text-shadow: 0 8px 34px rgba(0, 0, 0, 0.6); }
      .w { display: inline-block; transform-origin: 50% 100%; }
      #hook-rule { position: absolute; left: 84px; top: 596px; width: 300px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--orange), var(--amber)); transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="e02-hook" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="hook-l1" class="line clip" data-start="0" data-duration="4" data-track-index="0">
        <span class="w">SHIP</span> <span class="w">DOCKED.</span>
      </div>
      <div id="hook-l2" class="line clip" data-start="0" data-duration="4" data-track-index="1">
        <span class="w">CARGO</span> <span class="w">DIDN'T</span> <span class="w" id="hook-move">MOVE.</span>
      </div>
      <div id="hook-rule-wrap" class="clip" data-start="0" data-duration="4" data-track-index="2" data-layout-ignore>
        <div id="hook-rule"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Hard stop: fast fall in, squash on impact, springy settle.
      const drop = (el, at) => {
        tl.fromTo(el, { y: -520, opacity: 0, scaleY: 1.25, scaleX: 0.9 }, { y: 0, opacity: 1, scaleY: 1, scaleX: 1, duration: 0.2, ease: "power3.in" }, at);
        tl.to(el, { scaleY: 0.82, scaleX: 1.1, duration: 0.05, ease: "power1.out" }, at + 0.2);
        tl.to(el, { scaleY: 1, scaleX: 1, duration: 0.45, ease: "elastic.out(1.1, 0.35)" }, at + 0.25);
      };
      const l1 = document.querySelectorAll("#hook-l1 .w");
      const l2 = document.querySelectorAll("#hook-l2 .w");
      drop(l1[0], 0.3); drop(l1[1], 0.42);
      drop(l2[0], 1.0); drop(l2[1], 1.14); drop(l2[2], 1.3);
      // "MOVE." shudders: it tries to move and cannot.
      [[-10, 0], [9, 0], [-6, 0], [5, 0], [-2, 0], [0, 0]].forEach(([x], i) => tl.to("#hook-move", { x, duration: 0.04, ease: "none" }, 1.62 + i * 0.04));
      tl.fromTo("#hook-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 1.7);
      // Everything falls out with the camera.
      tl.to(["#hook-l1 .w", "#hook-l2 .w"], { y: 900, opacity: 0, duration: 0.35, ease: "power3.in", stagger: 0.035 }, 3.5);
      tl.to("#hook-rule", { scaleX: 0, duration: 0.25, ease: "power2.in" }, 3.5);
      window.__timelines["e02-hook"] = tl;
    </script>
  </body>
</html>
