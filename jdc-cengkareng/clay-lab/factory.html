<script type="module">

  sc.add(new THREE.HemisphereLight('#ffe39a','#6a4a08',1.3));[-1.2,0,1.2].forEach(z=>{const pl=new THREE.PointLight('#FFD86B',6,4.5,1.6);pl.position.set(0,H-.35,z);sc.add(pl)});
